[package]
name = "codearch"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Local code-graph lookups for coding agents: importers and cross-language route callers"
repository = "https://github.com/Iasonassss0007/Code-Arch"
default-run = "codearch"

[features]
default = []
llm = ["dep:llama-cpp-2"]

[dependencies]
llama-cpp-2 = { version = "0.1.156", optional = true }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tiktoken-rs = "0.12.0"
tree-sitter = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23.2"
